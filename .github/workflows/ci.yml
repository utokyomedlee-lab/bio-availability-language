name: BAL CI

on:
  push:
    branches: ["main", "bal-*"]
  pull_request:
    branches: ["main", "bal-v0.4.0-dev"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install packaging tools
        run: python -m pip install --upgrade pip build twine
      - name: Build distributions
        run: python -m build
      - name: Validate distributions
        run: python -m twine check dist/*
      - name: Install BAL wheel
        run: python -m pip install dist/*.whl
      - name: Compile source
        run: python -m compileall -q bal bal_runtime
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check BAL example
        run: bal check examples/availability.bal
      - name: Execute BAL examples
        run: bal run examples/hello.bal && bal run examples/availability.bal
